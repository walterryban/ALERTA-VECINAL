<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerta Vecinal Pro — Consola COM</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --accent:#38bdf8; --danger:#ef4444; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,sans-serif; }
    body { background-color:var(--bg); color:var(--text); padding:20px; min-height:100vh; transition: background 0.3s ease; }
    
    /* Efecto estroboscópico de emergencia en toda la pantalla */
    body.alerta-activa {
      animation: estroboscopio 0.5s infinite alternate;
    }
    @keyframes estroboscopio {
      0% { background-color: var(--bg); }
      100% { background-color: #7f1d1d; }
    }

    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #334155; padding-bottom:15px; }
    header h1 { font-size:1.4rem; color:var(--danger); font-weight:800; display:flex; align-items:center; gap:8px; }
    header p { font-size:0.8rem; color:#94a3b8; }
    
    .btn-salir { background:transparent; border:1px solid #475569; color:#94a3b8; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:600; }
    .btn-salir:hover { background:#334155; color:#fff; }

    .table-container { background:var(--card); border-radius:12px; border:1px solid #334155; overflow:hidden; box-shadow:0 4px 6px -1px rgba(0,0,0,0.3); }
    table { width:100%; border-collapse:collapse; text-align:left; font-size:0.9rem; }
    th { background:#090d16; color:#94a3b8; padding:12px 16px; font-weight:600; text-transform:uppercase; font-size:0.75rem; letter-spacing:0.5px; }
    td { padding:14px 16px; border-top:1px solid #334155; color:#e2e8f0; }
    tr:hover { background:rgba(255,255,255,0.02); }

    .badge-alerta { background:#7f1d1d; color:#fca5a5; padding:4px 10px; border-radius:20px; font-weight:700; font-size:0.75rem; display:inline-block; border:1px solid #dc2626; }
    .badge-estado { background:#166534; color:#bbf7d0; padding:4px 10px; border-radius:20px; font-weight:600; font-size:0.75rem; }

    /* Modal Emergencia Gigante */
    #modalEmergencia { position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:9999; }
    .modal-content { background:#1e293b; border:4px solid var(--danger); border-radius:16px; padding:30px; width:90%; max-width:550px; text-align:center; box-shadow:0 0 50px rgba(239,68,68,0.7); }
    .modal-content h2 { color:var(--danger); font-size:2rem; margin-bottom:15px; font-weight:900; }
    .modal-data { font-size:1.1rem; margin:10px 0; text-align:left; background:#0f172a; padding:12px; border-radius:8px; border:1px solid #334155; }
    .btn-cerrar-modal { background:var(--danger); color:white; border:none; padding:12px 24px; font-size:1rem; font-weight:bold; border-radius:8px; cursor:pointer; margin-top:20px; width:100%; }
  </style>
</head>
<body>

<div class="container" style="max-width:1200px; margin:0 auto;">
  <header>
    <div>
      <h1>🚨 Alerta Vecinal Pro — Consola COM</h1>
      <p>Centro de Operaciones y Monitoreo Municipal | San Luis / Villa Mercedes</p>
    </div>
    <button class="btn-salir" onclick="window.location.reload()">Actualizar / Reconectar</button>
  </header>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Fecha / Hora</th>
          <th>Manzana</th>
          <th>Tipo Alerta</th>
          <th>Vecino / Teléfono</th>
          <th>Ficha Médica</th>
          <th>Estado</th>
        </tr>
      <tbody id="tablaAlertasBody">
        <tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:20px;">Cargando registros en tiempo real...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Gigante para Emergencias en Vivo -->
<div id="modalEmergencia">
  <div class="modal-content">
    <h2>🚨 ¡ALERTA DE EMERGENCIA!</h2>
    <div class="modal-data" id="modalTextoDetalle">Cargando datos...</div>
    <button class="btn-cerrar-modal" onclick="cerrarModalAlerta()">ATENDIDO / SILENCIAR ALARMA</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://wwirxlwgsswkzqiwqkux.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_udTmjDidXlwFaOwEpeEKug_u4BtdXeB";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.addEventListener('DOMContentLoaded', () => {
    cargarAlertas();
    escucharAlertasEnTiempoReal();
  });

  // Cargar histórico inicial de alertas
  async function cargarAlertas() {
    const { data, error } = await supabaseClient
      .from('alertas')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(30);

    if (error) {
      console.error("Error al cargar alertas:", error.message);
      return;
    }

    const tbody = document.getElementById('tablaAlertasBody');
    tbody.innerHTML = '';

    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:20px;">No hay alertas registradas.</td></tr>`;
      return;
    }

    data.forEach(alerta => {
      const fecha = new Date(alerta.created_at).toLocaleString('es-AR');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${fecha}</td>
        <td><strong>${alerta.manzana || 'N/A'}</strong></td>
        <td><span class="badge-alerta">${alerta.tipo_alerta}</span></td>
        <td><strong>${alerta.vecino_nombre}</strong><br><span style="color:var(--accent); font-size:0.8rem;">📞 ${alerta.vecino_telefono}</span></td>
        <td>${alerta.ficha_medica || 'Sin registros'}</td>
        <td><span class="badge-estado">${alerta.estado}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- TIEMPO REAL CON SUPABASE Y EFECTOS DE IMPACTO ---
  function escucharAlertasEnTiempoReal() {
    supabaseClient.removeAllChannels();

    supabaseClient
      .channel('canal-alertas-com')
      .on(
        'postgres_changes', 
        { event: 'INSERT', schema: 'public', table: 'alertas' }, 
        (payload) => {
          console.log("🚨 ¡Nueva alerta en vivo!", payload.new);
          
          // 1. Refrescar la tabla
          cargarAlertas();
          
          // 2. Reproducir sirena de audio
          try {
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.play().catch(e => console.log("Audio bloqueado por navegador:", e));
          } catch(err) {}

          // 3. Activar luces estroboscópicas rojas en la pantalla
          document.body.classList.add('alerta-activa');

          // 4. Mostrar el modal flotante gigante
          dispararPopUpEmergencia(payload.new);
        }
      )
      .subscribe((status) => {
        console.log("Estado de conexión Realtime COM:", status);
      });
  }

  function dispararPopUpEmergencia(alerta) {
    const modal = document.getElementById('modalEmergencia');
    const detalle = document.getElementById('modalTextoDetalle');
    
    detalle.innerHTML = `
      <p><strong>Tipo:</strong> <span style="color:#fca5a5;">${alerta.tipo_alerta}</span></p>
      <p><strong>Zona / Manzana:</strong> ${alerta.manzana}</p>
      <p><strong>Vecino Afectado:</strong> ${alerta.vecino_nombre}</p>
      <p><strong>Teléfono:</strong> ${alerta.vecino_telefono}</p>
      <p><strong>Ficha Médica:</strong> ${alerta.ficha_medica}</p>
      <p><strong>Hora:</strong> ${new Date(alerta.created_at).toLocaleTimeString('es-AR')}</p>
    `;
    modal.style.display = 'flex';
  }

  function cerrarModalAlerta() {
    document.getElementById('modalEmergencia').style.display = 'none';
    document.body.classList.remove('alerta-activa');
  }
</script>

</body>
</html>
