<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Monitoreo | Alerta Vecinal Pro</title>
    
    <!-- Librería para generar QRs dinámicos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #09090b;
            --card-bg: #121215;
            --text: #ffffff;
            --border: #27272a;
            --primary: #38bdf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: #ffffff;
        }
        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            max-width: 600px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            color: #a1a1aa;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #18181b;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .btn-gen {
            background: var(--primary);
            color: #000000;
            font-weight: bold;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            margin-top: 10px;
        }
        .qr-output {
            margin-top: 20px;
            display: none;
            text-align: center;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            color: #000;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }
        .btn-print {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>🔒 Centro de Monitoreo & Gestión de Manzanas</h1>

    <!-- HERRAMIENTA 1: GENERADOR DE QR POR MANZANA QUE ABONÓ -->
    <div class="section-card">
        <h2>🏷️ Generador Automático de QR por Manzana</h2>
        <p style="color: #a1a1aa; font-size: 0.9rem;">
            Ingresa el nombre de la manzana que contrató el servicio único para generar su cartel QR oficial.
        </p>

        <div class="form-group">
            <label for="mzaInput">Nombre / Número de Manzana / Cuadra:</label>
            <input type="text" id="mzaInput" placeholder="Ej: Manzana 12 o Cuadra España 400">
        </div>

        <button class="btn-gen" onclick="generarQRManzana()">📱 Generar Código QR de Acceso</button>

        <!-- RESULTADO DEL QR -->
        <div id="qrContainer" class="qr-output">
            <h3 id="qrTitle" style="margin: 0; color: #000;"></h3>
            <div id="qrcode"></div>
            <p id="qrUrlText" style="font-size: 0.8rem; color: #555; word-break: break-all;"></p>
            <p><strong>PIN de Activación para el Vecino:</strong> <span style="background: #e0f2fe; padding: 4px 8px; border-radius: 4px; font-weight: bold; color: #0369a1;">3030</span></p>
            <button class="btn-print" onclick="imprimirQR()">🖨️ Imprimir / Guardar Cartel QR</button>
        </div>
    </div>

    <script>
        let qrCodeInstance = null;

        function generarQRManzana() {
            const mzaVal = document.getElementById('mzaInput').value.trim();
            if (!mzaVal) {
                alert("Por favor escribe el nombre o número de la manzana.");
                return;
            }

            // URL base dinámica del proyecto desplegado
            const baseUrl = window.location.origin + window.location.pathname.replace("admin.html", "index.html");
            const fullUrl = `${baseUrl}?mza=${encodeURIComponent(mzaVal)}`;

            document.getElementById('qrTitle').innerText = `🚨 ALERTA VECINAL - ${mzaVal.toUpperCase()}`;
            document.getElementById('qrUrlText').innerText = fullUrl;

            // Limpiar QR anterior si existe
            const qrDiv = document.getElementById("qrcode");
            qrDiv.innerHTML = "";

            // Generar nuevo QR
            qrCodeInstance = new QRCode(qrDiv, {
                text: fullUrl,
                width: 220,
                height: 220,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            document.getElementById('qrContainer').style.display = "block";
        }

        function imprimirQR() {
            const printContent = document.getElementById('qrContainer').innerHTML;
            const printWindow = window.open('', '', 'height=600,width=600');
            printWindow.document.write('<html><head><title>Cartel QR Manzana</title>');
            printWindow.document.write('<style>body{font-family:sans-serif; text-align:center; padding:30px;} #qrcode{display:flex; justify-content:center; margin:20px 0;}</style>');
            printWindow.document.write('</head><body>');
            printWindow.document.write(printContent);
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.print();
        }
    </script>
</body>
</html>
