<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerta Vecinal Pro — Consola COM</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --accent:#38bdf8; --danger:#ef4444; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,sans-serif; }
    body { background-color:var(--bg); color:var(--text); padding:20px; min-height:100vh; transition: background 0.2s ease; }
    
    /* EFECTO ESTROBOSCÓPICO ROJO FUERTE */
    body.alerta-activa {
      animation: estroboscopio 0.4s infinite alternate;
    }
    @keyframes estroboscopio {
      0% { background-color: #0f172a; }
      100% { background-color: #991b1b; }
    }

    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #334155; padding-bottom:15px; }
    header h1 { font-size:1.4rem; color:var(--danger); font-weight:800; display:flex; align-items:center; gap:8px; }
    header p { font-size:0.8rem; color:#94a3b8; }
    
    .btn-audio { background:#22c55e; color:#000; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:bold; }
    
    .table-container { background:var(--card); border-radius:12px; border:1px solid #334155; overflow:hidden; }
    table { width:100%; border-collapse:collapse; text-align:left; font-size:0.9rem; }
    th { background:#090d16; color:#94a3b8; padding:12px 16px; font-weight:600; text-transform:uppercase; font-size:0.75rem; }
    td { padding:14px 16px; border-top:1px solid #334155; color:#e2e8f0; }

    .badge-alerta { background:#7f1d1d; color:#fca5a5; padding:4px 10px; border-radius:20px; font-weight:700; font-size:0.75rem; border:1px solid #dc2626; }
    .badge-estado { background:#166534; color:#bbf7d0; padding:4px 10px; border-radius:20px; font-weight:600; font-size:0.75rem; }

    /* POP-UP GIGANTE */
    #modalEmergencia { position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.88); display:none; justify-content:center; align-items:center; z-index:9999; }
    .modal-content { background:#1e293b; border:4px solid var(--danger); border-radius:16px; padding:30px; width:90%; max-width:550px; text-align:center; box-shadow:0 0 50px rgba(239,68,68,0.8); }
    .modal-content h2 { color:var(--danger); font-size:2rem; margin-bottom:15px; font-weight:900; }
    .modal-data { font-size:1.1rem; margin:10px 0; text-align:left; background:#0f172a; padding:16px; border-radius:8px; border:1px solid #334155; line-height:1.6; }
    .btn-cerrar-modal { background:var(--danger); color:white; border:none; padding:14px 24px; font-size:1rem; font-weight:bold; border-radius:8px; cursor:pointer; margin-top:15px; width:100%; }
  </style>
</head>
<body>

<div class="container" style="max-width:1200px; margin:0 auto;">
  <header>
    <div>
      <h1>🚨 Alerta Vecinal Pro — Consola COM</h1>
      <p>Centro de Operaciones y Monitoreo Municipal | San Luis / Villa Mercedes</p>
    </div>
    <button class="btn-audio" id="btnHabilitarAudio" onclick="activarAudioSistema()">🔊 Habilitar Audio / Sirena</button>
  </header>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Fecha / Hora</th>
          <th>Manzana</th>
          <th>Tipo Alerta</th>
          <th>Vecino / Teléfono</th>
          <th>Ficha Médica</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="tablaAlertasBody">
        <tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:20px;">Cargando registros...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Pop-up Modal Flotante -->
<div id="modalEmergencia">
  <div class="modal-content">
    <h2>🚨 ¡ALERTA DE EMERGENCIA!</h2>
    <div class="modal-data" id="modalTextoDetalle">Cargando datos...</div>
    <button class="btn-cerrar-modal" onclick="cerrarModalAlerta()">SILENCIAR SIRENA Y ATENDER</button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://wwirxlwgsswkzqiwqkux.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_udTmjDidXlwFaOwEpeEKug_u4BtdXeB";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let audioContext = null;

  window.addEventListener('DOMContentLoaded', () => {
    cargarAlertas();
    escucharAlertasEnTiempoReal();
  });

  function activarAudioSistema() {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') audioContext.resume();
    const btn = document.getElementById('btnHabilitarAudio');
    btn.innerText = "✅ Sirena Activa";
    btn.style.background = "#334155";
    btn.style.color = "#22c55e";
  }

  async function cargarAlertas() {
    const { data, error } = await supabaseClient
      .from('alertas')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(30);

    if (error) return;

    const tbody = document.getElementById('tablaAlertasBody');
    tbody.innerHTML = '';

    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:20px;">Sin alertas.</td></tr>`;
      return;
    }

    data.forEach(alerta => {
      const fecha = new Date(alerta.created_at).toLocaleString('es-AR');
      
      const nombreFinal = alerta.vecino_nombre || alerta.nombre || 'Vecino Registrado';
      const telefonoFinal = alerta.vecino_telefono || alerta.telefono || 'Sin teléfono';
      const fichaFinal = alerta.ficha_medica || 'Sin registros';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${fecha}</td>
        <td><strong>${alerta.manzana || 'MANZANA A'}</strong></td>
        <td><span class="badge-alerta">${alerta.tipo_alerta}</span></td>
        <td><strong>${nombreFinal}</strong><br><span style="color:var(--accent); font-size:0.8rem;">📞 ${telefonoFinal}</span></td>
        <td>${fichaFinal}</td>
        <td><span class="badge-estado">${alerta.estado || 'PENDIENTE'}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function escucharAlertasEnTiempoReal() {
    supabaseClient.removeAllChannels();

    supabaseClient
      .channel('canal-alertas-com')
      .on(
        'postgres_changes', 
        { event: 'INSERT', schema: 'public', table: 'alertas' }, 
        (payload) => {
          console.log("🚨 Alerta en tiempo real:", payload.new);
          
          cargarAlertas();
          sonarSirenaInterna();
          document.body.classList.add('alerta-activa');
          dispararPopUpEmergencia(payload.new);
        }
      )
      .subscribe();
  }

  function sonarSirenaInterna() {
    try {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();

      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(900, audioContext.currentTime);
          osc.frequency.exponentialRampToValueAtTime(450, audioContext.currentTime + 0.35);
          
          gain.gain.setValueAtTime(0.4, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.35);
          
          osc.connect(gain);
          gain.connect(audioContext.destination);
          
          osc.start();
          osc.stop(audioContext.currentTime + 0.35);
        }, i * 400);
      }
    } catch(e) { console.log("Audio no activado aún:", e); }
  }

  function dispararPopUpEmergencia(alerta) {
    const modal = document.getElementById('modalEmergencia');
    const detalle = document.getElementById('modalTextoDetalle');
    
    const nombre = alerta.vecino_nombre || alerta.nombre || 'Vecino Registrado';
    const telefono = alerta.vecino_telefono || alerta.telefono || 'Sin teléfono';
    const ficha = alerta.ficha_medica || 'Sin registros';

    detalle.innerHTML = `
      <p style="margin-bottom:8px;"><strong>TIPO:</strong> <span style="color:#fca5a5; font-size:1.3rem; font-weight:bold;">${alerta.tipo_alerta}</span></p>
      <p style="margin-bottom:8px;"><strong>ZONA / MANZANA:</strong> ${alerta.manzana}</p>
      <p style="margin-bottom:8px;"><strong>VECINO:</strong> ${nombre}</p>
      <p style="margin-bottom:8px;"><strong>TELÉFONO:</strong> ${telefono}</p>
      <p style="margin-bottom:8px;"><strong>FICHA MÉDICA:</strong> ${ficha}</p>
      <p><strong>HORA:</strong> ${new Date(alerta.created_at).toLocaleTimeString('es-AR')}</p>
    `;
    modal.style.display = 'flex';
  }

  function cerrarModalAlerta() {
    document.getElementById('modalEmergencia').style.display = 'none';
    document.body.classList.remove('alerta-activa');
  }
</script>
</body>
</html>
