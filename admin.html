<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Monitoreo Municipal — Alerta Vecinal Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --accent: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f3f4f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    #login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 13, 22, 0.95); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .login-card {
      background: var(--card); padding: 32px; border-radius: 12px; border: 1px solid #1f2937;
      width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .login-card h2 { color: var(--danger); margin-bottom: 8px; font-size: 1.4rem; }
    .login-card p { color: #9ca3af; font-size: 0.85rem; margin-bottom: 20px; }
    
    .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; margin-bottom: 14px; }
    label { font-size: 0.8rem; font-weight: 600; color: #9ca3af; text-transform: uppercase; }
    input, select { background: #1f2937; border: 1px solid #374151; color: #fff; padding: 10px; border-radius: 8px; font-size: 0.95rem; }
    
    .btn-primary { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem; }
    .btn-primary:hover { opacity: 0.9; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #1f2937; margin-bottom: 24px; }
    .header-title h1 { font-size: 1.6rem; color: #fff; display: flex; align-items: center; gap: 10px; }
    .header-title p { color: #9ca3af; font-size: 0.9rem; }
    
    .table-container { overflow-x: auto; background: var(--card); border-radius: 12px; border: 1px solid #1f2937; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { background: #1f2937; padding: 14px; color: #9ca3af; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
    td { padding: 14px; border-bottom: 1px solid #1f2937; vertical-align: middle; }
    
    tr.coaccion-row {
      background: rgba(239, 68, 68, 0.25) !important;
      border-left: 6px solid #ef4444;
      animation: flashCoaccion 1.5s infinite alternate;
    }
    @keyframes flashCoaccion {
      from { background: rgba(239, 68, 68, 0.15); }
      to { background: rgba(239, 68, 68, 0.4); }
    }

    .badge { padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; display: inline-block; }
    .badge-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
    .badge-coaccion { background: #ef4444; color: #fff; border: 1px solid #f87171; font-weight: 900; letter-spacing: 1px; }
    .badge-warning { background: rgba(245, 158, 11, 0.2); color: #fde68a; border: 1px solid #f59e0b; }
    .badge-success { background: rgba(34, 197, 94, 0.2); color: #86efac; border: 1px solid #22c55e; }

    .btn-logout { background: #374151; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>

<div id="login-overlay">
  <div class="login-card">
    <h2>CENTRO DE MONITOREO</h2>
    <p>Ingrese credenciales de operador autorizado</p>
    
    <div class="form-group">
      <label>Correo Institucional</label>
      <input type="email" id="loginEmail" placeholder="operador@sanluis.gob.ar" />
    </div>
    
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="loginPassword" placeholder="••••••••" />
    </div>
    
    <button class="btn-primary" onclick="iniciarSesion()">Ingresar a la Consola</button>
  </div>
</div>

<div class="container" id="app-dashboard" style="display:none;">
  <header>
    <div class="header-title">
      <h1>🚨 Alerta Vecinal Pro — Consola COM</h1>
      <p>Centro de Operaciones y Monitoreo Municipal | San Luis / Villa Mercedes</p>
    </div>
    <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
  </header>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Fecha / Hora</th>
          <th>Manzana</th>
          <th>Tipo Alerta</th>
          <th>Vecino / Teléfono</th>
          <th>Ficha Médica</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaAlertasBody">
        <tr>
          <td colspan="7" style="text-align:center; color:#9ca3af;">Cargando eventos en tiempo real...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // Configuración Supabase con tus credenciales reales
  const SUPABASE_URL = "https://wwirxlwgsswkzqiwqkux.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_udTmjDidXlwFaOwEpeEKug_u4BtdXeB";
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      mostrarDashboard();
    }
  });

  async function iniciarSesion() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if (!email || !password) {
      alert("Ingrese correo y contraseña.");
      return;
    }

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      alert("Acceso denegado: " + error.message);
    } else {
      mostrarDashboard();
    }
  }

  async function cerrarSesion() {
    await supabase.auth.signOut();
    location.reload();
  }

  function mostrarDashboard() {
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('app-dashboard').style.display = 'block';
    cargarAlertas();
    escucharAlertasEnTiempoReal();
  }

  async function cargarAlertas() {
    const { data, error } = await supabase
      .from('alertas')
      .select('*')
      .order('created_at', { ascending: false });

    if (!error && data) {
      renderizarTabla(data);
    }
  }

  function renderizarTabla(alertas) {
    const tbody = document.getElementById('tablaAlertasBody');
    tbody.innerHTML = '';

    if (alertas.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#9ca3af;">No hay alertas registradas.</td></tr>`;
      return;
    }

    alertas.forEach(a => {
      const isCoaccion = a.tipo_alerta && a.tipo_alerta.toUpperCase().includes('COACCIÓN');
      const tr = document.createElement('tr');
      if (isCoaccion) tr.className = 'coaccion-row';

      const fecha = new Date(a.created_at || Date.now()).toLocaleString('es-AR');
      
      tr.innerHTML = `
        <td>${fecha}</td>
        <td><strong>${a.manzana || 'N/A'}</strong></td>
        <td>
          <span class="badge ${isCoaccion ? 'badge-coaccion' : 'badge-danger'}">
            ${a.tipo_alerta}
          </span>
        </td>
        <td>
          <strong>${a.vecino_nombre || 'Anónimo'}</strong><br>
          <small style="color:#38bdf8;">📞 ${a.vecino_telefono || 'Sin datos'}</small>
        </td>
        <td><small style="color:#cbd5e1;">${a.ficha_medica || 'Sin registros'}</small></td>
        <td>
          <span class="badge ${a.estado === 'RESUELTA' ? 'badge-success' : 'badge-warning'}">
            ${a.estado || 'PENDIENTE'}
          </span>
        </td>
        <td>
          <select onchange="cambiarEstado('${a.id}', this.value)" style="padding:4px; font-size:0.8rem;">
            <option value="PENDIENTE" ${a.estado === 'PENDIENTE' ? 'selected' : ''}>PENDIENTE</option>
            <option value="EN PROCESO" ${a.estado === 'EN PROCESO' ? 'selected' : ''}>EN PROCESO</option>
            <option value="RESUELTA" ${a.estado === 'RESUELTA' ? 'selected' : ''}>RESUELTA</option>
          </select>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function escucharAlertasEnTiempoReal() {
    supabase
      .channel('schema-db-changes')
      .on('postgres_changes', { event: 'INSERT', table: 'alertas' }, payload => {
        cargarAlertas();
        const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        audio.play().catch(() => {});
      })
      .subscribe();
  }

  async function cambiarEstado(id, nuevoEstado) {
    await supabase.from('alertas').update({ estado: nuevoEstado }).eq('id', id);
    cargarAlertas();
  }
</script>
</body>
</html>
