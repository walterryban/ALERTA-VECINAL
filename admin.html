<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alerta Vecinal Pro — Terminal Ciudadana</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --primary:#d90429; --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --accent:#38bdf8; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:system-ui,-apple-system,sans-serif; }
    body { background-color:var(--bg); color:var(--text); padding:16px; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
    .container { width:100%; max-width:480px; display:flex; flex-direction:column; gap:16px; }
    header { text-align:center; margin-bottom:8px; }
    header h1 { font-size:1.5rem; color:#ef4444; font-weight:800; letter-spacing:0.5px; }
    header p { font-size:0.85rem; color:#94a3b8; }
    .card { background:var(--card); border-radius:12px; padding:16px; border:1px solid #334155; }
    .form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
    label { font-size:0.8rem; font-weight:600; color:#cbd5e1; text-transform:uppercase; }
    input, select { background:#0f172a; border:1px solid #475569; color:#fff; padding:10px; border-radius:8px; font-size:0.95rem; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }
    .sos-wrapper { display:flex; flex-direction:column; align-items:center; justify-content:center; margin:16px 0; position:relative; }
    .sos-btn { width:180px; height:180px; border-radius:50%; background:radial-gradient(circle,#ef4444 0%,#991b1b 100%); border:4px solid #fca5a5; color:white; font-weight:900; font-size:1.8rem; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; user-select:none; -webkit-user-select:none; box-shadow:0 0 25px rgba(239,68,68,0.5); transition:transform 0.1s ease; position:relative; overflow:hidden; touch-action:none; }
    .sos-btn:active { transform:scale(0.96); }
    .sos-progress { position:absolute; bottom:0; left:0; width:100%; height:0%; background:rgba(255,255,255,0.4); transition:height 0.05s linear; pointer-events:none; }
    .sos-hint { font-size:0.75rem; color:#94a3b8; margin-top:8px; text-align:center; }
    .legal-box { display:flex; align-items:flex-start; gap:8px; font-size:0.75rem; color:#94a3b8; margin-top:8px; }
    .legal-box input { margin-top:2px; }
    .status-badge { background:#1e293b; color:#22c55e; border:1px solid #166534; padding:6px 12px; border-radius:20px; font-size:0.8rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
    .dot { width:8px; height:8px; background:#22c55e; border-radius:50%; animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%{opacity:1;} 50%{opacity:0.3;} 100%{opacity:1;} }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>ALERTA VECINAL PRO</h1>
    <p>Rastreo Urbano GPS — Terminal Ciudadana</p>
    <div style="margin-top:8px;">
      <span class="status-badge"><span class="dot"></span> PWA Activa & Georreferenciada</span>
    </div>
  </header>

  <div class="card" id="section-registro">
    <h3 style="font-size:1rem; margin-bottom:12px; color:var(--accent);">1. Validación de Vecino y Manzana</h3>
    <div class="form-group"><label>Manzana / Zona</label><input type="text" id="inputManzana" placeholder="Ej: MANZANA A" /></div>
    <div class="form-group"><label>Código PIN de Manzana</label><input type="password" id="inputPinManzana" placeholder="Ingrese PIN de su manzana" /></div>
    <div class="form-group"><label>Nombre y Apellido</label><input type="text" id="inputNombre" placeholder="Tu nombre completo" /></div>
    <div class="form-group"><label>Teléfono (Solo visible para Monitoreo)</label><input type="tel" id="inputTelefono" placeholder="266 4000000" /></div>
    <div class="form-group"><label>Ficha Médica / Alergias (Opcional)</label><input type="text" id="inputFichaMedica" placeholder="Ej: O+, Diabético, Alérgico a Penicilina" /></div>
    <div class="legal-box">
      <input type="checkbox" id="checkLey25326" checked />
      <label for="checkLey25326" style="text-transform:none; font-weight:normal; color:#94a3b8;">
        Acepto el tratamiento de mis datos de acuerdo a la <strong>Ley 25.326</strong> para gestión exclusiva de emergencias.
      </label>
    </div>
    <button onclick="validarYGuardar()" style="width:100%; margin-top:14px; background:var(--accent); color:#000; font-weight:bold; border:none; padding:12px; border-radius:8px; cursor:pointer;">
      Validar Acceso a Manzana
    </button>
  </div>

  <div class="card" id="section-sos" style="display:none; text-align:center;">
    <h3 style="font-size:1rem; color:#ef4444; margin-bottom:8px;">DISPARADOR DE EMERGENCIA</h3>
    <p style="font-size:0.8rem; color:#94a3b8;" id="infoVecinoLogueado">Listo para disparar alerta</p>
    <div class="form-group" style="margin-top:12px;">
      <select id="selectTipoAlerta">
        <option value="ROBO / INSEGURIDAD">🚨 ROBO / INSEGURIDAD</option>
        <option value="ACTIVIDAD SOSPECHOSA">👁️ ACTIVIDAD SOSPECHOSA</option>
        <option value="EMERGENCIA MÉDICA">🚑 EMERGENCIA MÉDICA</option>
        <option value="INCENDIO">🔥 INCENDIO</option>
        <option value="COACCIÓN / SECUESTRO">⚠️ COACCIÓN / SECUESTRO</option>
      </select>
    </div>
    <div class="sos-wrapper">
      <div class="sos-btn" id="btnSOS">
        <span>S.O.S</span>
        <span style="font-size:0.7rem; font-weight:normal; margin-top:4px;">MANTENER 3s</span>
        <div class="sos-progress" id="sosProgress"></div>
      </div>
      <p class="sos-hint">Mantén presionado durante 3 segundos para enviar la alerta real.</p>
    </div>
    <button onclick="cerrarSesionVecino()" style="background:transparent; border:1px solid #475569; color:#94a3b8; padding:8px 12px; border-radius:6px; font-size:0.8rem; cursor:pointer; margin-top:8px;">
      Cambiar de Datos / Salir
    </button>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://wwirxlwgsswkzqiwqkux.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_udTmjDidXlwFaOwEpeEKug_u4BtdXeB";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.addEventListener('DOMContentLoaded', () => {
    cargarAlertas();
    escucharAlertasEnTiempoReal();
  });

  // Cargar histórico inicial
  async function cargarAlertas() {
    const { data, error } = await supabaseClient
      .from('alertas')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(30);

    if (error) {
      console.error("Error al cargar alertas:", error.message);
      return;
    }

    const tbody = document.getElementById('tablaAlertasBody');
    tbody.innerHTML = '';

    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:20px;">No hay alertas registradas.</td></tr>`;
      return;
    }

    data.forEach(alerta => {
      const fecha = new Date(alerta.created_at).toLocaleString('es-AR');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${fecha}</td>
        <td><strong>${alerta.manzana || 'N/A'}</strong></td>
        <td><span class="badge-alerta">${alerta.tipo_alerta}</span></td>
        <td><strong>${alerta.vecino_nombre}</strong><br><span style="color:var(--accent); font-size:0.8rem;">📞 ${alerta.vecino_telefono}</span></td>
        <td>${alerta.ficha_medica || 'Sin registros'}</td>
        <td><span class="badge-estado">${alerta.estado}</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  // --- TIEMPO REAL CON SUPABASE Y EFECTOS BLINDADOS ---
  function escucharAlertasEnTiempoReal() {
    supabaseClient.removeAllChannels();

    supabaseClient
      .channel('canal-alertas-com')
      .on(
        'postgres_changes', 
        { event: 'INSERT', schema: 'public', table: 'alertas' }, 
        (payload) => {
          console.log("🚨 ¡Alerta nueva en vivo recibida!", payload.new);
          
          // 1. Refrescar la tabla
          cargarAlertas();
          
          // 2. Reproducir alarma sonora infalible (Sintetizador Web Audio API)
          reproducirAlarmaSonora();

          // 3. Activar luces estroboscópicas rojas en toda la pantalla
          document.body.classList.add('alerta-activa');

          // 4. Mostrar el modal flotante gigante
          dispararPopUpEmergencia(payload.new);
        }
      )
      .subscribe((status) => {
        console.log("Estado Realtime COM:", status);
      });
  }

  // Generador de sirena interna (No depende de internet ni links externos)
  function reproducirAlarmaSonora() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // Hacemos sonar 3 tonos de alerta tipo patrulla
      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.3);
          
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }, i * 350);
      }
    } catch(e) {
      console.log("Error reproduciendo audio sintetizado:", e);
    }
  }

  function dispararPopUpEmergencia(alerta) {
    const modal = document.getElementById('modalEmergencia');
    const detalle = document.getElementById('modalTextoDetalle');
    
    detalle.innerHTML = `
      <p style="margin-bottom:8px;"><strong>Tipo:</strong> <span style="color:#fca5a5; font-size:1.2rem;">${alerta.tipo_alerta}</span></p>
      <p style="margin-bottom:8px;"><strong>Zona / Manzana:</strong> ${alerta.manzana}</p>
      <p style="margin-bottom:8px;"><strong>Vecino Afectado:</strong> ${alerta.vecino_nombre}</p>
      <p style="margin-bottom:8px;"><strong>Teléfono:</strong> ${alerta.vecino_telefono}</p>
      <p style="margin-bottom:8px;"><strong>Ficha Médica:</strong> ${alerta.ficha_medica}</p>
      <p><strong>Hora:</strong> ${new Date(alerta.created_at).toLocaleTimeString('es-AR')}</p>
    `;
    modal.style.display = 'flex';
  }

  function cerrarModalAlerta() {
    document.getElementById('modalEmergencia').style.display = 'none';
    document.body.classList.remove('alerta-activa');
  }
</script>
</body>
</html>
