
    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Vecinal Pro | San Luis y Villa Mercedes</title>
    <link rel="manifest" href="manifest.json">
    <!-- PWA / Meta Tags de Grado Comercial -->
    <meta name="theme-color" content="#d32f2f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Alerta Pro">

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #d32f2f;
            --primary-hover: #b71c1c;
            --bg-color: #09090b;
            --card-bg: #121214;
            --border: #27272a;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --success: #22c55e;
            --coaction-bg: #1f1f23;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 4px;
            color: var(--primary);
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .status-radar {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--success);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 1; }
            70% { transform: scale(1.6); opacity: 0; }
            100% { transform: scale(0.95); opacity: 0; }
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #18181b;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .accordion-btn {
            background: transparent;
            border: none;
            color: #38bdf8;
            font-size: 0.85rem;
            padding: 0;
            margin: 10px 0 14px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .accordion-content {
            display: none;
            background: rgba(14, 165, 233, 0.05);
            border: 1px solid rgba(14, 165, 233, 0.2);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .btn-panic {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(211, 47, 47, 0.4);
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-panic:hover {
            background: var(--primary-hover);
        }

        .btn-panic:active {
            transform: scale(0.98);
        }

        .admin-link-container {
            margin-top: 24px;
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        .admin-link {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .admin-link:hover {
            color: var(--text);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛡️ Alerta Vecinal Pro</h1>
        <div class="subtitle">Sistema Táctico de Seguridad Inteligente</div>

        <div class="status-radar">
            <div class="pulse"></div>
            ZONA MONITOREADA EN TIEMPO REAL (GPS Activo)
        </div>

        <form id="alertaForm" onsubmit="enviarAlerta(event)">
            <div class="form-group">
                <label>Nombre y Apellido *</label>
                <input type="text" id="nombre" required placeholder="Ej: Carlos Gómez">
            </div>

            <div class="form-group">
                <label>Teléfono (WhatsApp) *</label>
                <input type="tel" id="telefono" required placeholder="Ej: 2664123456">
            </div>

            <div class="form-group">
                <label>Dirección / Altura *</label>
                <input type="text" id="direccion" required placeholder="Ej: San Martín 820">
            </div>

            <div class="form-group">
                <label>Manzana / Sector / Cuadrante *</label>
                <input type="text" id="manzana" required placeholder="Ej: MANZANA A">
            </div>

            <div class="form-group">
                <label>PIN de Seguridad o Coacción *</label>
                <input type="password" id="pin" required placeholder="PIN autorizado">
            </div>

            <button type="button" class="accordion-btn" onclick="toggleMed()">
                🚑 Ficha Médica SOS (Configuración Opcional)
            </button>

            <div id="medContent" class="accordion-content">
                <div class="form-group" style="margin-bottom: 8px;">
                    <label>Grupo Sanguíneo</label>
                    <input type="text" id="grupo_sanguineo" placeholder="Ej: 0+">
                </div>
                <div class="form-group" style="margin-bottom: 8px;">
                    <label>Alergias / Medicamentos</label>
                    <input type="text" id="alergias" placeholder="Ej: Alérgico a la penicilina">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Teléfono de Contacto ICE (Emergencia)</label>
                    <input type="tel" id="contacto_ice" placeholder="Ej: Familiar directo">
                </div>
            </div>

            <button type="submit" class="btn-panic">🚨 Activar Terminal Segura</button>
        </form>

        <div class="admin-link-container">
            <button class="admin-link" onclick="accesoAdmin()">🔒 Acceso Centro de Monitoreo</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wwirxlwgsswkzqiwqkux.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_udTmjDidXlwFaOwEpeEKug_u4BtdXeBL';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function toggleMed() {
            const content = document.getElementById('medContent');
            content.style.display = content.style.display === 'block' ? 'none' : 'block';
        }

        function accesoAdmin() {
            const pinAdmin = prompt("Ingrese PIN de Operador:");
            if (pinAdmin === "1234") { // Puedes cambiar tu PIN de operador aquí
                window.location.href = "admin.html";
            } else if (pinAdmin !== null) {
                alert("PIN incorrecto.");
            }
        }

        async function enviarAlerta(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const direccion = document.getElementById('direccion').value;
            const manzana = document.getElementById('manzana').value;
            const pin = document.getElementById('pin').value;
            
            const grupo_sanguineo = document.getElementById('grupo_sanguineo').value;
            const alergias = document.getElementById('alergias').value;
            const contacto_ice = document.getElementById('contacto_ice').value;

            // Simulación de PIN de Coacción Inverso (Ej: Si el PIN termina en 99 o es específico)
            let tipoAlerta = "🚨 ALERTA GENERAL DE PÁNICO";
            if (pin === "9999" || pin.startsWith("00")) {
                tipoAlerta = "⚠️ ALERTA SILENCIOSA DE COACCIÓN (REHENES)";
            }

            // Obtener Geolocalización GPS real del dispositivo
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapsUrl = `https://maps.google.com/?q=${lat},${lon}`;

                    await guardarEnSupabase(nombre, telefono, direccion, manzana, tipoAlerta, mapsUrl, grupo_sanguineo, alergias, contacto_ice);
                }, async (error) => {
                    // Si el usuario deniega el GPS, enviamos igual con ubicación por defecto o texto
                    const mapsUrl = `https://maps.google.com/?q=-33.3017,-66.3378`; // San Luis Centro aprox
                    await guardarEnSupabase(nombre, telefono, direccion, manzana, tipoAlerta, mapsUrl, grupo_sanguineo, alergias, contacto_ice);
                }, { enableHighAccuracy: true });
            } else {
                const mapsUrl = `https://maps.google.com/?q=-33.3017,-66.3378`;
                await guardarEnSupabase(nombre, telefono, direccion, manzana, tipoAlerta, mapsUrl, grupo_sanguineo, alergias, contacto_ice);
            }
        }

        async function guardarEnSupabase(nombre, telefono, direccion, manzana, tipoAlerta, ubicacion_url, grupo_sanguineo, alergias, contacto_ice) {
            const { error } = await db.from('alertas').insert([
                {
                    nombre_vecino: nombre,
                    telefono: telefono,
                    direccion: direccion,
                    manzana: manzana,
                    tipo_alerta: tipoAlerta,
                    ubicacion_url: ubicacion_url,
                    grupo_sanguineo: grupo_sanguineo || 'No especificado',
                    alergias: alergias || 'Ninguna',
                    contacto_ice: contacto_ice || 'No especificado'
                }
            ]);

            if (error) {
                alert("Error al emitir alerta. Verifique su conexión.");
            } else {
                if (tipoAlerta.includes("COACCIÓN")) {
                    // Falsa pantalla de error de red para engañar a terceros en caso de coacción
                    alert("⚠️ Error de red temporal (Código 503). Intentando reconectar...");
                } else {
                    alert("✅ ¡Alerta emitida con éxito! El centro de monitoreo ha recibido su posición GPS.");
                }
                document.getElementById('alertaForm').reset();
            }
        }
    </script>
</body>
</html>
