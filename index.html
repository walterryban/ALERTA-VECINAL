<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alerta Vecinal Pro — Terminal Ciudadana</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #d90429;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    header { text-align: center; margin-bottom: 8px; }
    header h1 { font-size: 1.5rem; color: #ef4444; font-weight: 800; letter-spacing: 0.5px; }
    header p { font-size: 0.85rem; color: #94a3b8; }
    
    .card { background: var(--card); border-radius: 12px; padding: 16px; border: 1px solid #334155; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    label { font-size: 0.8rem; font-weight: 600; color: #cbd5e1; text-transform: uppercase; }
    input, select { background: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 8px; font-size: 0.95rem; }
    
    /* Botón SOS con Medidor de Presión */
    .sos-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 16px 0; position: relative; }
    .sos-btn {
      width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, #ef4444 0%, #991b1b 100%);
      border: 4px solid #fca5a5; color: white; font-weight: 900; font-size: 1.8rem; display: flex;
      flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
      user-select: none; -webkit-user-select: none; box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
      transition: transform 0.1s ease; position: relative; overflow: hidden;
    }
    .sos-btn:active { transform: scale(0.96); }
    .sos-progress {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
      background: rgba(255, 255, 255, 0.3); transition: height 0.1s linear; pointer-events: none;
    }
    .sos-hint { font-size: 0.75rem; color: #94a3b8; margin-top: 8px; text-align: center; }

    /* Consentimiento Ley 25.326 */
    .legal-box { display: flex; align-items: flex-start; gap: 8px; font-size: 0.75rem; color: #94a3b8; margin-top: 8px; }
    .legal-box input { margin-top: 2px; }

    .status-badge { background: #1e293b; color: #22c55e; border: 1px solid #166534; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>ALERTA VECINAL PRO</h1>
    <p>Rastreo Urbano GPS — Sistema Ciudadano</p>
    <div style="margin-top: 8px;">
      <span class="status-badge"><span class="dot"></span> PWA Activa & Georreferenciada</span>
    </div>
  </header>

  <!-- Formulario de Validación de Manzana y Registro -->
  <div class="card" id="section-registro">
    <h3 style="font-size: 1rem; margin-bottom: 12px; color: var(--accent);">1. Validación de Vecino y Manzana</h3>
    
    <div class="form-group">
      <label>Manzana / Zona</label>
      <input type="text" id="inputManzana" placeholder="Ej: Manzana 12" />
    </div>

    <div class="form-group">
      <label>Código PIN de Manzana</label>
      <input type="password" id="inputPinManzana" placeholder="Ingrese PIN de su manzana" />
    </div>

    <div class="form-group">
      <label>Nombre y Apellido</label>
      <input type="text" id="inputNombre" placeholder="Tu nombre completo" />
    </div>

    <div class="form-group">
      <label>Teléfono (Solo visible para Monitoreo)</label>
      <input type="tel" id="inputTelefono" placeholder="266 4000000" />
    </div>

    <div class="form-group">
      <label>Ficha Médica / Alergias (Opcional)</label>
      <input type="text" id="inputFichaMedica" placeholder="Ej: O+, Diabético, Alérgico a Penicilina" />
    </div>

    <!-- Checkbox Ley 25.326 -->
    <div class="legal-box">
      <input type="checkbox" id="checkLey25326" />
      <label for="checkLey25326" style="text-transform: none; font-weight: normal; color: #94a3b8;">
        Acepto el tratamiento de mis datos personales y de salud de acuerdo a la <strong>Ley Nacional 25.326</strong>, autorizando su uso exclusivo para la gestión de emergencias por el Centro de Monitoreo.
      </label>
    </div>

    <button onclick="validarYGuardar()" style="width:100%; margin-top:14px; background:var(--accent); color:#000; font-weight:bold; border:none; padding:12px; border-radius:8px; cursor:pointer;">
      Validar Acceso a Manzana
    </button>
  </div>

  <!-- Panel Botón SOS -->
  <div class="card" id="section-sos" style="display:none; text-align:center;">
    <h3 style="font-size: 1rem; color: #ef4444; margin-bottom: 8px;">DISPARADOR DE EMERGENCIA</h3>
    <p style="font-size:0.8rem; color:#94a3b8;">Selecciona la categoría y presiona el botón</p>

    <div class="form-group" style="margin-top:12px;">
      <select id="selectTipoAlerta">
        <option value="ROBO / INSEGURIDAD">🚨 ROBO / INSEGURIDAD</option>
        <option value="ACTIVIDAD SOSPECHOSA">👁️ ACTIVIDAD SOSPECHOSA</option>
        <option value="EMERGENCIA MÉDICA">🚑 EMERGENCIA MÉDICA</option>
        <option value="INCENDIO">🔥 INCENDIO</option>
      </select>
    </div>

    <div class="sos-wrapper">
      <div class="sos-btn" id="btnSOS">
        <span>S.O.S</span>
        <span style="font-size:0.7rem; font-weight:normal; margin-top:4px;">MANTENER 3s</span>
        <div class="sos-progress" id="sosProgress"></div>
      </div>
      <p class="sos-hint">Mantén presionado durante 3 segundos para evitar disparos accidentales.</p>
    </div>
  </div>
</div>

<script>
  // Inicialización Supabase con tus credenciales reales
  const SUPABASE_URL = "https://wwirxlwgsswkzqiwqkux.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_udTmjDidXlwFaOwEpeEKug_u4BtdXeB";
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let holdTimer = null;
  let holdDuration = 3000; // 3 segundos
  let startTime = 0;
  let progressInterval = null;

  // Autoconfiguración mediante URL con QR Dinámico (?mza=Manzana_12)
  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const mzaParam = urlParams.get('mza');
    if (mzaParam) {
      document.getElementById('inputManzana').value = decodeURIComponent(mzaParam);
    }

    if (localStorage.getItem('vecino_validado') === 'true') {
      document.getElementById('section-registro').style.display = 'none';
      document.getElementById('section-sos').style.display = 'block';
    }
  });

  // Validación remota en Supabase del PIN de Manzana
  async function validarYGuardar() {
    const mza = document.getElementById('inputManzana').value.trim();
    const pin = document.getElementById('inputPinManzana').value.trim();
    const nombre = document.getElementById('inputNombre').value.trim();
    const tel = document.getElementById('inputTelefono').value.trim();
    const checkLey = document.getElementById('checkLey25326').checked;

    if (!mza || !pin || !nombre || !tel) {
      alert("Por favor, completa todos los campos requeridos.");
      return;
    }

    if (!checkLey) {
      alert("Debes aceptar los Términos y Condiciones conforme a la Ley 25.326 para continuar.");
      return;
    }

    const { data, error } = await supabase
      .from('manzanas')
      .select('pin')
      .eq('nombre_manzana', mza)
      .single();

    if (error || !data || data.pin !== pin) {
      alert("PIN de Manzana incorrecto o manzana no registrada.");
      return;
    }

    localStorage.setItem('vecino_validado', 'true');
    localStorage.setItem('vecino_manzana', mza);
    localStorage.setItem('vecino_nombre', nombre);
    localStorage.setItem('vecino_telefono', tel);
    localStorage.setItem('vecino_ficha', document.getElementById('inputFichaMedica').value.trim());

    document.getElementById('section-registro').style.display = 'none';
    document.getElementById('section-sos').style.display = 'block';
    alert("Acceso a Manzana verificado correctamente.");
  }

  // Lógica de Retención del Botón SOS (3 Segundos)
  const btnSOS = document.getElementById('btnSOS');
  const progressBar = document.getElementById('sosProgress');

  function startHold(e) {
    e.preventDefault();
    startTime = Date.now();
    progressBar.style.height = '0%';
    
    progressInterval = setInterval(() => {
      let elapsed = Date.now() - startTime;
      let pct = Math.min((elapsed / holdDuration) * 100, 100);
      progressBar.style.height = pct + '%';
    }, 50);

    holdTimer = setTimeout(() => {
      clearInterval(progressInterval);
      progressBar.style.height = '100%';
      dispararAlerta();
    }, holdDuration);
  }

  function cancelHold() {
    clearTimeout(holdTimer);
    clearInterval(progressInterval);
    progressBar.style.height = '0%';
  }

  btnSOS.addEventListener('mousedown', startHold);
  btnSOS.addEventListener('mouseup', cancelHold);
  btnSOS.addEventListener('mouseleave', cancelHold);
  btnSOS.addEventListener('touchstart', startHold);
  btnSOS.addEventListener('touchend', cancelHold);

  // Envío Asíncrono de Alerta con GPS optimizado
  async function dispararAlerta() {
    const tipo = document.getElementById('selectTipoAlerta').value;
    const mza = localStorage.getItem('vecino_manzana');
    const nombre = localStorage.getItem('vecino_nombre');
    const tel = localStorage.getItem('vecino_telefono');
    const ficha = localStorage.getItem('vecino_ficha');

    const { data, error } = await supabase
      .from('alertas')
      .insert([{
        manzana: mza,
        tipo_alerta: tipo,
        vecino_nombre: nombre,
        vecino_telefono: tel,
        ficha_medica: ficha,
        lat: null,
        lng: null,
        estado: 'PENDIENTE'
      }])
      .select();

    if (error) {
      alert("Error al conectar con la central: " + error.message);
      return;
    }

    alert("🚨 ¡ALERTA ENVIADA AL CENTRO DE MONITOREO!");

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(async (pos) => {
        if (data && data[0]) {
          await supabase.from('alertas').update({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          }).eq('id', data[0].id);
        }
      }, null, { enableHighAccuracy: true, timeout: 8000 });
    }
  }
</script>
</body>
</html>
