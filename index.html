<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Vecinal Pro</title>
    
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #d32f2f;
            --primary-dark: #b71c1c;
            --secondary: #25d366;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 5px 0 0 0;
            color: var(--primary);
            font-size: 1.6rem;
        }

        .header p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #444;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        input[readonly] {
            background-color: #e9ecef;
            color: #495057;
            font-weight: bold;
            cursor: not-allowed;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-success {
            background-color: var(--secondary);
            color: white;
            margin-top: 10px;
        }

        .divider {
            height: 1px;
            background: #eee;
            margin: 24px 0;
        }

        .badge-info {
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span style="font-size: 2.5rem;">🚨</span>
            <h1>Alerta Vecinal Pro</h1>
            <p>San Luis & Villa Mercedes</p>
        </div>

        <!-- Formulario de Registro -->
        <div class="section-title">📝 Registro de Vecino</div>
        <form id="registro-form">
            <div class="form-group">
                <label for="nombre">Nombre y Apellido *</label>
                <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono (WhatsApp) *</label>
                <input type="tel" id="telefono" placeholder="Ej: 2664123456" required>
            </div>

            <div class="form-group">
                <label for="direccion">Dirección / Altura *</label>
                <input type="text" id="direccion" placeholder="Ej: Av. Illia 540" required>
            </div>

            <div class="form-group">
                <label for="manzana">Manzana / Sector / Cuadra *</label>
                <input type="text" id="manzana" placeholder="Ej: MANZANA A" required>
                <div id="badge-auto" class="badge-info">📌 Zona detectada automáticamente por QR</div>
            </div>

            <div class="form-group">
                <label for="pin">PIN de Seguridad de la Zona *</label>
                <input type="password" id="pin" maxlength="6" placeholder="Ingrese el PIN autorizado" required>
            </div>

            <button type="submit" class="btn btn-primary">Registrarse y Activar App</button>
        </form>

        <div class="divider"></div>

        <!-- Panel de Disparo de Emergencia -->
        <div class="section-title">🚨 Botón de Alerta</div>
        <div class="form-group">
            <label for="tipo-alerta">Tipo de Emergencia</label>
            <select id="tipo-alerta">
                <option value="🚨 EMERGENCIA / ROBO">🚨 Robo / Inseguridad</option>
                <option value="🔥 INCENDIO">🔥 Incendio</option>
                <option value="🚑 EMERGENCIA MÉDICA">🚑 Emergencia Médica</option>
                <option value="👁️ SOSPECHOSO EN LA ZONA">👁️ Actividad Sospechosa</option>
            </select>
        </div>

        <button type="button" class="btn btn-success" onclick="dispararAlerta()">
            📢 Emitir Alerta de Emergencia
        </button>
        
        <p style="font-size: 0.75rem; color: #777; text-align: center; margin-top: 10px;">
            Al pulsar se registrará la alerta y abrirá la ubicación exacta por GPS.
        </p>
    </div>

    <script>
        const SUPABASE_URL = 'https://wwirxlwgsswkzqiwqkux.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_udTmjDidXlwFaOwEpeEKug_u4BtdXeBL';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let vendedorAsignado = 'Directo';

        // Captura automática de Manzana y Vendedor desde el enlace QR
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mzaParam = urlParams.get('mza');
            const vendParam = urlParams.get('vend');

            if (mzaParam) {
                const inputManzana = document.getElementById('manzana');
                inputManzana.value = decodeURIComponent(mzaParam).toUpperCase();
                inputManzana.readOnly = true;
                document.getElementById('badge-auto').style.display = 'block';
            }

            if (vendParam) {
                vendedorAsignado = decodeURIComponent(vendParam).toUpperCase();
            }
        });

        // Validar PIN contra la tabla 'manzanas' y guardar registro
        document.getElementById('registro-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const direccion = document.getElementById('direccion').value;
            const manzana = document.getElementById('manzana').value.toUpperCase();
            const pinIngresado = document.getElementById('pin').value;

            // 1. Verificar si el PIN coincide con la manzana en Supabase
            const { data: mzaData, error: mzaError } = await db
                .from('manzanas')
                .select('pin_autorizado')
                .eq('nombre_manzana', manzana)
                .single();

            if (mzaError || !mzaData) {
                alert('⚠️ La zona o manzana ingresada no está registrada en el sistema.');
                return;
            }

            if (mzaData.pin_autorizado !== pinIngresado) {
                alert('❌ PIN de seguridad incorrecto. Verifique con su promotor o administrador.');
                return;
            }

            // 2. Guardar el registro del vecino con estado ACTIVO
            const { error: insertError } = await db.from('vecinos').insert([{
                nombre: nombre,
                telefono: telefono,
                direccion: direccion,
                manzana: manzana,
                vendedor: vendedorAsignado,
                pin_ingresado: pinIngresado,
                estado: 'ACTIVO'
            }]);

            if (insertError) {
                alert('Error al registrar: ' + insertError.message);
            } else {
                alert('✅ ¡Registro exitoso! Su aplicación de Alerta Vecinal Pro ya está activa.');
            }
        });

        // Disparar Alerta con Geolocalización
        async function dispararAlerta() {
            const tipo = document.getElementById('tipo-alerta').value;
            const manzana = document.getElementById('manzana').value || 'ZONA GENERAL';
            const nombre = document.getElementById('nombre').value || 'Vecino';

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const mapUrl = `https://maps.google.com/?q=${lat},${lng}`;

                    // Guardar alerta en base de datos
                    await db.from('alertas').insert([{
                        tipo_alerta: tipo,
                        manzana: manzana,
                        ubicacion_url: mapUrl,
                        nombre_vecino: nombre
                    }]);

                    // Redirigir a WhatsApp
                    const mensaje = encodeURIComponent(`*${tipo}*\n\n👤 *Vecino:* ${nombre}\n📍 *Zona:* ${manzana}\n🗺️ *Ubicación GPS:* ${mapUrl}`);
                    window.open(`https://wa.me/?text=${mensaje}`, '_blank');
                }, () => {
                    alert("Por favor habilite la ubicación GPS de su teléfono para enviar la alerta.");
                });
            } else {
                alert("Su dispositivo no soporta geolocalización.");
            }
        }
    </script>
</body>
</html>
