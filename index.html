<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Vecinal Pro | San Luis y Villa Mercedes</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Alerta Pro">
    
    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #d32f2f;
            --primary-dark: #b71c1c;
            --bg: #09090b;
            --card-bg: #121215;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #18181b;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary);
        }
        .accordion-btn {
            background: transparent;
            border: none;
            color: #38bdf8;
            font-size: 0.85rem;
            padding: 0;
            margin: 10px 0 14px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .accordion-content {
            display: none;
            background: rgba(14, 165, 233, 0.05);
            border: 1px solid rgba(14, 165, 233, 0.2);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 14px;
        }
        .btn-alerta {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
        .btn-alerta:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        /* ESTILOS DE LA PANTALLA PRINCIPAL DE VECINO (DASHBOARD) */
        #userDashboard {
            display: none;
            text-align: center;
        }
        .user-card {
            background: #18181b;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 0.85rem;
        }
        .user-card strong {
            color: #38bdf8;
        }
        .btn-panic-giant {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #ef4444 0%, #b71c1c 100%);
            color: white;
            border: 4px solid #f87171;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
            margin: 10px auto 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-panic-giant:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.9);
        }
        .btn-coaccion-discreet {
            background: #27272a;
            color: var(--text-muted);
            border: 1px solid #3f3f46;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            font-size: 0.8rem;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .btn-edit-data {
            background: transparent;
            color: #38bdf8;
            border: none;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .admin-link {
            text-align: center;
            margin-top: 20px;
        }
        .admin-link a {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
        }
        .admin-link a:hover {
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 Alerta Vecinal Pro</h1>
        
        <!-- VISTA 1: FORMULARIO DE REGISTRO INICIAL -->
        <div id="registerForm">
            <form id="alertaForm" onsubmit="guardarRegistro(event)">
                <div class="form-group">
                    <label>Nombre y Apellido</label>
                    <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
                </div>

                <div class="form-group">
                    <label>Teléfono / Celular</label>
                    <input type="tel" id="telefono" required placeholder="Ej: 2664...">
                </div>

                <div class="form-group">
                    <label>Dirección / Calle</label>
                    <input type="text" id="direccion" required placeholder="Ej: Av. España">
                </div>

                <div class="form-group">
                    <label>Manzana / Casa / Lote</label>
                    <input type="text" id="manzana" required placeholder="Ej: Mza 3 Casa 12">
                </div>

                <button type="button" class="accordion-btn" onclick="toggleMed()">
                    <span>➕ Agregar Ficha Médica SOS (Opcional)</span>
                </button>

                <div id="medContent" class="accordion-content">
                    <div class="form-group">
                        <label>Grupo Sanguíneo</label>
                        <input type="text" id="grupo_sanguineo" placeholder="Ej: O+">
                    </div>
                    <div class="form-group">
                        <label>Alergias / Padecimientos</label>
                        <input type="text" id="alergias" placeholder="Ej: Penicilina, Asma">
                    </div>
                    <div class="form-group">
                        <label>Contacto ICE (Emergencia)</label>
                        <input type="text" id="contacto_ice" placeholder="Nombre y Teléfono">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-alerta">🚨 Guardar y Activar Terminal</button>
            </form>
        </div>

        <!-- VISTA 2: DASHBOARD PRINCIPAL DEL VECINO -->
        <div id="userDashboard">
            <div class="user-card" id="userInfoCard">
                <!-- Se llena dinámicamente con JS -->
            </div>

            <button class="btn-panic-giant" onclick="enviarAlertaDirecta(false)">
                <span style="font-size: 2.5rem;">🚨</span>
                <span>DISPARAR SOS</span>
            </button>

            <button class="btn-coaccion-discreet" onclick="preguntarPinCoaccion()">
                ⚠️ Reportar Situación Silenciosa / PIN
            </button>

            <br>
            <button class="btn-edit-data" onclick="editarDatos()">✏️ Editar mis datos guardados</button>
        </div>

        <div class="admin-link">
            <a href="#" onclick="accesoAdmin()">🔒 Acceso Centro de Monitoreo</a>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN OFICIAL DE SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://wwirxlwgsswkzqiwqkux.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_udTmjDidXlwFaOwEpeEKug_u4BtdXeB';
        
        let supabaseClient;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {
            console.error("Error al inicializar Supabase:", err);
        }

        // Comprobar al cargar si el usuario ya registró sus datos en el teléfono
        document.addEventListener("DOMContentLoaded", () => {
            comprobarUsuarioRegistrado();
        });

        function toggleMed() {
            const content = document.getElementById('medContent');
            content.style.display = content.style.display === 'block' ? 'none' : 'block';
        }

        function accesoAdmin() {
            const pinAdmin = prompt("Ingrese PIN de Operador:");
            if (pinAdmin === "1234" || pinAdmin === "SL-8492") { 
                window.location.href = "admin.html";
            } else if (pinAdmin !== null) {
                alert("PIN incorrecto.");
            }
        }

        function comprobarUsuarioRegistrado() {
            const userData = localStorage.getItem("alerta_vecinal_user");
            if (userData) {
                const user = JSON.parse(userData);
                document.getElementById("registerForm").style.display = "none";
                document.getElementById("userDashboard").style.display = "block";
                
                document.getElementById("userInfoCard").innerHTML = `
                    👤 <strong>${user.nombre}</strong><br>
                    📍 ${user.direccion} (${user.manzana})<br>
                    📞 ${user.telefono}
                `;
            } else {
                document.getElementById("registerForm").style.display = "block";
                document.getElementById("userDashboard").style.display = "none";
            }
        }

        function guardarRegistro(e) {
            e.preventDefault();
            const user = {
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                direccion: document.getElementById('direccion').value,
                manzana: document.getElementById('manzana').value,
                grupo_sanguineo: document.getElementById('grupo_sanguineo').value,
                alergias: document.getElementById('alergias').value,
                contacto_ice: document.getElementById('contacto_ice').value
            };

            localStorage.setItem("alerta_vecinal_user", JSON.stringify(user));
            alert("✅ Datos guardados correctamente en esta terminal.");
            comprobarUsuarioRegistrado();
        }

        function editarDatos() {
            if (confirm("¿Desea modificar sus datos de registro?")) {
                const userData = localStorage.getItem("alerta_vecinal_user");
                if (userData) {
                    const user = JSON.parse(userData);
                    document.getElementById('nombre').value = user.nombre || "";
                    document.getElementById('telefono').value = user.telefono || "";
                    document.getElementById('direccion').value = user.direccion || "";
                    document.getElementById('manzana').value = user.manzana || "";
                    document.getElementById('grupo_sanguineo').value = user.grupo_sanguineo || "";
                    document.getElementById('alergias').value = user.alergias || "";
                    document.getElementById('contacto_ice').value = user.contacto_ice || "";
                }
                localStorage.removeItem("alerta_vecinal_user");
                comprobarUsuarioRegistrado();
            }
        }

        function obtenerUbicacionGPS() {
            return new Promise((resolve) => {
                if (!("geolocation" in navigator)) {
                    resolve(null);
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve(pos.coords),
                    () => resolve(null),
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            });
        }

        function preguntarPinCoaccion() {
            const pin = prompt("Ingrese PIN de Coacción / Emergencia Silenciosa:");
            if (pin === "9999") {
                enviarAlertaDirecta(true);
            } else if (pin !== null) {
                alert("PIN no reconocido.");
            }
        }

        async function enviarAlertaDirecta(esCoaccion) {
            const userData = localStorage.getItem("alerta_vecinal_user");
            if (!userData) {
                alert("Error: No se encontraron datos de usuario. Por favor regístrese.");
                comprobarUsuarioRegistrado();
                return;
            }

            const user = JSON.parse(userData);
            const tipoAlerta = esCoaccion ? "COACCION / REHENES" : "ALERTA PANICO";

            // Obtener GPS
            const coords = await obtenerUbicacionGPS();
            let lat = null;
            let lng = null;
            let mapsLink = "Sin GPS preciso (Dirección: " + user.direccion + ")";

            if (coords) {
                lat = coords.latitude;
                lng = coords.longitude;
                mapsLink = `https://www.google.com/maps?q=${lat},${lng}`;
            }

            const payload = {
                nombre: user.nombre,
                telefono: user.telefono,
                direccion: user.direccion,
                manzana: user.manzana,
                tipo_alerta: tipoAlerta,
                es_coaccion: esCoaccion,
                latitud: lat,
                longitud: lng,
                maps_link: mapsLink,
                grupo_sanguineo: user.grupo_sanguineo,
                alergias: user.alergias,
                contacto_ice: user.contacto_ice,
                fecha_hora: new Date().toISOString()
            };

            try {
                const { data, error } = await supabaseClient
                    .from('alertas')
                    .insert([payload]);

                if (error) throw error;

                if (esCoaccion) {
                    alert("Error 503: Falla de conexión con el servidor. Intente nuevamente.");
                } else {
                    alert("🚨 ¡ALERTA ENVIADA CON ÉXITO!\nEl Centro de Monitoreo ha sido notificado.");
                }

            } catch (err) {
                console.error("Error al enviar alerta a Supabase:", err);
                const detalle = err.message || err.error_description || JSON.stringify(err);
                alert("⚠️ Error al enviar alerta: " + detalle);
            }
        }
    </script>
</body>
</html>
