<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Vecinal Pro | San Luis y Villa Mercedes</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Alerta Pro">
    
    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #d32f2f;
            --bg: #09090b;
            --card-bg: #121215;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #18181b;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary);
        }
        .accordion-btn {
            background: transparent;
            border: none;
            color: #38bdf8;
            font-size: 0.85rem;
            padding: 0;
            margin: 10px 0 14px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .accordion-content {
            display: none;
            background: rgba(14, 165, 233, 0.05);
            border: 1px solid rgba(14, 165, 233, 0.2);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 14px;
        }
        .btn-alerta {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }
        .btn-alerta:active {
            opacity: 0.9;
            transform: scale(0.98);
        }
        .admin-link {
            text-align: center;
            margin-top: 20px;
        }
        .admin-link a {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
        }
        .admin-link a:hover {
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 Alerta Vecinal Pro</h1>
        
        <form id="alertaForm" onsubmit="enviarAlerta(event)">
            <div class="form-group">
                <label>Nombre y Apellido</label>
                <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
            </div>

            <div class="form-group">
                <label>Teléfono / Celular</label>
                <input type="tel" id="telefono" required placeholder="Ej: 2664...">
            </div>

            <div class="form-group">
                <label>Dirección / Calle</label>
                <input type="text" id="direccion" required placeholder="Ej: Av. España">
            </div>

            <div class="form-group">
                <label>Manzana / Casa / Lote</label>
                <input type="text" id="manzana" required placeholder="Ej: Mza 3 Casa 12">
            </div>

            <div class="form-group">
                <label>PIN de Seguridad / Coacción</label>
                <input type="password" id="pin" required placeholder="PIN (ej: 1234)">
            </div>

            <button type="button" class="accordion-btn" onclick="toggleMed()">
                <span>➕ Agregar Ficha Médica SOS (Opcional)</span>
            </button>

            <div id="medContent" class="accordion-content">
                <div class="form-group">
                    <label>Grupo Sanguíneo</label>
                    <input type="text" id="grupo_sanguineo" placeholder="Ej: O+">
                </div>
                <div class="form-group">
                    <label>Alergias / Padecimientos</label>
                    <input type="text" id="alergias" placeholder="Ej: Penicilina, Asma">
                </div>
                <div class="form-group">
                    <label>Contacto ICE (Emergencia)</label>
                    <input type="text" id="contacto_ice" placeholder="Nombre y Teléfono">
                </div>
            </div>

            <button type="submit" class="btn-alerta">🚨 Activar Terminal Segura</button>
        </form>

        <div class="admin-link">
            <a href="#" onclick="accesoAdmin()">🔒 Acceso Centro de Monitoreo</a>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE SUPABASE (REVISA TUS DATOS)
        // ==========================================
        const SUPABASE_URL = 'https://TU_SUPABASE_URL.supabase.co';
        const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
        
        let supabaseClient;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {
            console.error("Error al inicializar Supabase:", err);
        }

        function toggleMed() {
            const content = document.getElementById('medContent');
            content.style.display = content.style.display === 'block' ? 'none' : 'block';
        }

        function accesoAdmin() {
            const pinAdmin = prompt("Ingrese PIN de Operador:");
            if (pinAdmin === "1234" || pinAdmin === "SL-8492") { 
                window.location.href = "admin.html";
            } else if (pinAdmin !== null) {
                alert("PIN incorrecto.");
            }
        }

        async function enviarAlerta(e) {
            e.preventDefault();
            alert("✅ Formulario interceptado correctamente. Obteniendo GPS...");

            const nombre = document.getElementById('nombre').value;
            const telefono = document.getElementById('telefono').value;
            const direccion = document.getElementById('direccion').value;
            const manzana = document.getElementById('manzana').value;
            const pin = document.getElementById('pin').value;
            
            const grupo_sanguineo = document.getElementById('grupo_sanguineo').value;
            const alergias = document.getElementById('alergias').value;
            const contacto_ice = document.getElementById('contacto_ice').value;

            const esCoaccion = (pin === "9999");
            const tipoAlerta = esCoaccion ? "COACCION / REHENES" : "ALERTA PANICO";

            if (!("geolocation" in navigator)) {
                alert("Su dispositivo no soporta geolocalización GPS.");
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const mapsLink = `https://www.google.com/maps?q=${lat},${lng}`;

                const payload = {
                    nombre: nombre,
                    telefono: telefono,
                    direccion: direccion,
                    manzana: manzana,
                    tipo_alerta: tipoAlerta,
                    es_coaccion: esCoaccion,
                    latitud: lat,
                    longitud: lng,
                    maps_link: mapsLink,
                    grupo_sanguineo: grupo_sanguineo,
                    alergias: alergias,
                    contacto_ice: contacto_ice,
                    fecha_hora: new Date().toISOString()
                };

                try {
                    const { data, error } = await supabaseClient
                        .from('alertas')
                        .insert([payload]);

                    if (error) throw error;

                    if (esCoaccion) {
                        alert("Error 503: Falla de conexión con el servidor. Intente nuevamente.");
                    } else {
                        alert("🚨 ¡Alerta enviada con éxito! El Centro de Monitoreo fue notificado.");
                    }

                } catch (err) {
                    console.error("Error al enviar alerta a Supabase:", err);
                    alert("Error al guardar en Supabase. Verifique las credenciales de la base de datos.");
                }
            }, (error) => {
                console.error("Error de GPS:", error);
                alert("No se pudo obtener la ubicación GPS. Por favor verifique los permisos de ubicación.");
            }, { enableHighAccuracy: true, timeout: 10000 });
        }
    </script>
</body>
</html>
