<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Vecinal Pro | San Luis y Villa Mercedes</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Alerta Pro">
    
    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #d32f2f;
            --primary-dark: #b71c1c;
            --bg: #09090b;
            --card-bg: #121215;
            --text: #ffffff;
            --text-muted: #d4d4d8;
            --border: #3f3f46;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            font-size: 1.15rem; /* Tamaño base accesible */
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 22px;
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 1.1rem;
            color: #f4f4f5;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input, select {
            width: 100%;
            padding: 16px;
            background: #18181b;
            border: 2px solid var(--border);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 600;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #ef4444;
        }
        .accordion-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-size: 1.05rem;
            font-weight: bold;
            padding: 14px;
            border-radius: 10px;
            margin: 14px 0;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .accordion-content {
            display: none;
            background: rgba(14, 165, 233, 0.05);
            border: 2px solid rgba(14, 165, 233, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .btn-alerta {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.25rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
        }
        .btn-alerta:active {
            opacity: 0.9;
            transform: scale(0.98);
        }

        /* ESTILOS ACCESIBLES DEL DASHBOARD PRINCIPAL */
        #userDashboard {
            display: none;
            text-align: center;
        }
        .user-card {
            background: #18181b;
            border: 2px solid #38bdf8;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 22px;
            text-align: left;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .user-card strong {
            color: #38bdf8;
            font-size: 1.2rem;
        }

        /* SELECTOR DE EVENTOS DIFERENCIADOS */
        .categoria-selector {
            margin-bottom: 18px;
            text-align: left;
        }
        .categoria-selector select {
            background-color: #27272a;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid #ef4444;
            height: 58px;
        }

        /* BOTÓN GIGANTE SOS CON ALTA VISIBILIDAD */
        .btn-panic-giant {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: radial-gradient(circle, #ef4444 0%, #b71c1c 100%);
            color: white;
            border: 6px solid #fca5a5;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.8);
            margin: 15px auto 25px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-panic-giant:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(239, 68, 68, 1);
        }
        .btn-coaccion-discreet {
            background: #27272a;
            color: #e4e4e7;
            border: 2px solid #52525b;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 16px;
        }
        .btn-edit-data {
            background: transparent;
            color: #38bdf8;
            border: none;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
            padding: 10px;
        }

        .admin-link {
            text-align: center;
            margin-top: 25px;
        }
        .admin-link a {
            color: var(--text-muted);
            font-size: 0.95rem;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 Alerta Vecinal Pro</h1>
        
        <!-- VISTA 1: FORMULARIO DE REGISTRO INICIAL (ACCESIBLE) -->
        <div id="registerForm">
            <form id="alertaForm" onsubmit="guardarRegistro(event)">
                <div class="form-group">
                    <label for="nombre">Nombre y Apellido</label>
                    <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono / Celular</label>
                    <input type="tel" id="telefono" required placeholder="Ej: 2664123456">
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección / Calle</label>
                    <input type="text" id="direccion" required placeholder="Ej: Av. España 1234">
                </div>

                <div class="form-group">
                    <label for="manzana">Manzana / Casa / Lote</label>
                    <input type="text" id="manzana" required placeholder="Ej: Mza 3 Casa 12">
                </div>

                <button type="button" class="accordion-btn" onclick="toggleMed()">
                    <span>➕ Agregar Ficha Médica SOS (Opcional)</span>
                </button>

                <div id="medContent" class="accordion-content">
                    <div class="form-group">
                        <label for="grupo_sanguineo">Grupo Sanguíneo</label>
                        <input type="text" id="grupo_sanguineo" placeholder="Ej: O+">
                    </div>
                    <div class="form-group">
                        <label for="alergias">Alergias / Padecimientos</label>
                        <input type="text" id="alergias" placeholder="Ej: Penicilina, Asma">
                    </div>
                    <div class="form-group">
                        <label for="contacto_ice">Contacto ICE (Emergencia)</label>
                        <input type="text" id="contacto_ice" placeholder="Nombre y Teléfono">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-alerta">🚨 Guardar y Activar Terminal</button>
            </form>
        </div>

        <!-- VISTA 2: DASHBOARD PRINCIPAL (ALERTAS DIFERENCIADAS Y ALTA VISIBILIDAD) -->
        <div id="userDashboard">
            <div class="user-card" id="userInfoCard">
                <!-- Datos del vecino -->
            </div>

            <!-- TIPO DE EMERGENCIA DIFERENCIADA -->
            <div class="categoria-selector">
                <label for="tipoEmergencia">Seleccione Tipo de Evento:</label>
                <select id="tipoEmergencia">
                    <option value="🚨 ROBO / INSEGURIDAD">🚨 ROBO / INSEGURIDAD</option>
                    <option value="👁️ ACTIVIDAD SOSPECHOSA">👁️ ACTIVIDAD SOSPECHOSA</option>
                    <option value="🚑 SALUD / EMERGENCIA MEDICA">🚑 SALUD / EMERGENCIA MÉDICA</option>
                    <option value="🔥 INCENDIO / BOMBEROS">🔥 INCENDIO / BOMBEROS</option>
                </select>
            </div>

            <!-- BOTÓN GIGANTE CON SONIDO Y VIBRACIÓN -->
            <button class="btn-panic-giant" id="btnSos" onclick="enviarAlertaDirecta(false)">
                <span style="font-size: 3rem;">🚨</span>
                <span>DISPARAR SOS</span>
            </button>

            <button class="btn-coaccion-discreet" onclick="preguntarPinCoaccion()">
                ⚠️ Reportar Situación Silenciosa / PIN
            </button>

            <br>
            <button class="btn-edit-data" onclick="editarDatos()">✏️ Editar mis datos guardados</button>
        </div>

        <div class="admin-link">
            <a href="#" onclick="accesoAdmin()">🔒 Acceso Centro de Monitoreo</a>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN SUPABASE
        const SUPABASE_URL = 'https://wwirxlwgsswkzqiwqkux.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_udTmjDidXlwFaOwEpeEKug_u4BtdXeB';
        
        let supabaseClient;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {
            console.error("Error al inicializar Supabase:", err);
        }

        document.addEventListener("DOMContentLoaded", () => {
            comprobarUsuarioRegistrado();
        });

        function toggleMed() {
            const content = document.getElementById('medContent');
            content.style.display = content.style.display === 'block' ? 'none' : 'block';
        }

        function accesoAdmin() {
            const pinAdmin = prompt("Ingrese PIN de Operador:");
            if (pinAdmin === "1234" || pinAdmin === "SL-8492") { 
                window.location.href = "admin.html";
            } else if (pinAdmin !== null) {
                alert("PIN incorrecto.");
            }
        }

        function comprobarUsuarioRegistrado() {
            const userData = localStorage.getItem("alerta_vecinal_user");
            if (userData) {
                const user = JSON.parse(userData);
                document.getElementById("registerForm").style.display = "none";
                document.getElementById("userDashboard").style.display = "block";
                
                document.getElementById("userInfoCard").innerHTML = `
                    👤 <strong>${user.nombre}</strong><br>
                    📍 ${user.direccion} (${user.manzana})<br>
                    📞 ${user.telefono}
                `;
            } else {
                document.getElementById("registerForm").style.display = "block";
                document.getElementById("userDashboard").style.display = "none";
            }
        }

        function guardarRegistro(e) {
            e.preventDefault();
            const user = {
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                direccion: document.getElementById('direccion').value,
                manzana: document.getElementById('manzana').value,
                grupo_sanguineo: document.getElementById('grupo_sanguineo').value,
                alergias: document.getElementById('alergias').value,
                contacto_ice: document.getElementById('contacto_ice').value
            };

            localStorage.setItem("alerta_vecinal_user", JSON.stringify(user));
            alert("✅ Datos guardados correctamente.");
            comprobarUsuarioRegistrado();
        }

        function editarDatos() {
            if (confirm("¿Desea modificar sus datos de registro?")) {
                const userData = localStorage.getItem("alerta_vecinal_user");
                if (userData) {
                    const user = JSON.parse(userData);
                    document.getElementById('nombre').value = user.nombre || "";
                    document.getElementById('telefono').value = user.telefono || "";
                    document.getElementById('direccion').value = user.direccion || "";
                    document.getElementById('manzana').value = user.manzana || "";
                    document.getElementById('grupo_sanguineo').value = user.grupo_sanguineo || "";
                    document.getElementById('alergias').value = user.alergias || "";
                    document.getElementById('contacto_ice').value = user.contacto_ice || "";
                }
                localStorage.removeItem("alerta_vecinal_user");
                comprobarUsuarioRegistrado();
            }
        }

        // GENERADOR DE SONIDO DE SIRENA CON WEB AUDIO API (NO REQUIERE ARCHIVOS EXTERNOS)
        function reproducirSonidoAlarma() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.6);

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            } catch (e) {
                console.log("Audio API no soportado o bloqueado");
            }

            // VIBRACIÓN DEL TELÉFONO
            if ("vibrate" in navigator) {
                navigator.vibrate([300, 100, 300, 100, 500]);
            }
        }

        function obtenerUbicacionGPS() {
            return new Promise((resolve) => {
                if (!("geolocation" in navigator)) {
                    resolve(null);
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve(pos.coords),
                    () => resolve(null),
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            });
        }

        function preguntarPinCoaccion() {
            const pin = prompt("Ingrese PIN de Coacción / Emergencia Silenciosa:");
            if (pin === "9999") {
                enviarAlertaDirecta(true);
            } else if (pin !== null) {
                alert("PIN no reconocido.");
            }
        }

        async function enviarAlertaDirecta(esCoaccion) {
            const userData = localStorage.getItem("alerta_vecinal_user");
            if (!userData) {
                alert("Error: No se encontraron datos de usuario. Por favor regístrese.");
                comprobarUsuarioRegistrado();
                return;
            }

            // Reproducir sonido y vibración
            if (!esCoaccion) {
                reproducirSonidoAlarma();
            }

            const user = JSON.parse(userData);
            
            // Tipo de alerta según selector o coacción
            let tipoAlerta = document.getElementById('tipoEmergencia').value;
            if (esCoaccion) {
                tipoAlerta = "⚠️ COACCION / REHENES";
            }

            const btn = document.getElementById('btnSos');
            if(btn) btn.innerText = "⏳ ENVIANDO...";

            const coords = await obtenerUbicacionGPS();
            let lat = null;
            let lng = null;
            let mapsLink = "Sin GPS preciso (Dirección: " + user.direccion + ")";

            if (coords) {
                lat = coords.latitude;
                lng = coords.longitude;
                mapsLink = `https://www.google.com/maps?q=${lat},${lng}`;
            }

            const payload = {
                nombre: user.nombre,
                telefono: user.telefono,
                direccion: user.direccion,
                manzana: user.manzana,
                tipo_alerta: tipoAlerta,
                es_coaccion: esCoaccion,
                latitud: lat,
                longitud: lng,
                maps_link: mapsLink,
                grupo_sanguineo: user.grupo_sanguineo,
                alergias: user.alergias,
                contacto_ice: user.contacto_ice,
                fecha_hora: new Date().toISOString()
            };

            try {
                const { data, error } = await supabaseClient
                    .from('alertas')
                    .insert([payload]);

                if (error) throw error;

                if (esCoaccion) {
                    alert("Error 503: Falla de conexión con el servidor. Intente nuevamente.");
                } else {
                    alert(`🚨 ¡ALERTA DE ${tipoAlerta} ENVIADA CON ÉXITO!\nEl Centro de Monitoreo ha sido notificado.`);
                }

            } catch (err) {
                console.error("Error al enviar alerta a Supabase:", err);
                const detalle = err.message || err.error_description || JSON.stringify(err);
                alert("⚠️ Error al enviar alerta: " + detalle);
            } finally {
                if(btn) btn.innerHTML = '<span style="font-size: 3rem;">🚨</span><span>DISPARAR SOS</span>';
            }
        }
    </script>
</body>
</html>
